name: Phone layout check

# phone：用幾種手機 / 平板尺寸打開主選單、世界地圖、關卡面板、戰鬥、暫停，
# 檢查按鈕有沒有被別的東西蓋住、有沒有超出畫面、有沒有程式錯誤。
# starfall：《星墜殘響》的實際點擊和每一關的自動對戰。整套接著跑要 25–50 分鐘（看當次分到的機器快慢），
# 會撞到時間上限，所以拆成幾個平行的工作，一個工作跑 scripts/starfall-check.cjs 裡 PARTS 的一份。
# 截圖都會上傳成 artifact。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone:
    # 固定在 24.04：這裡用的 Playwright 1.56.1 還不支援 ubuntu-latest 換上的 26.04（裝不了 Chromium）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build
        run: npx vite build

      - name: Start preview server
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:4173/td.html && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Check phone layouts
        run: node scripts/phone-check.cjs phone-check

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-check
          path: phone-check/
          retention-days: 7

  starfall:
    name: starfall (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 要和 scripts/starfall-check.cjs 的 PARTS 一樣（tests/starfall/ci.test.ts 會對）
        part: [ui, ch1-2, ch3, epilogue]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build
        run: npx vite build

      - name: Start preview server
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:4173/starfall.html && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Starfall check
        env:
          PART: ${{ matrix.part }}
        run: node scripts/starfall-check.cjs starfall-check

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starfall-check-${{ matrix.part }}
          path: starfall-check/
          retention-days: 7
