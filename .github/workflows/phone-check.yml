name: Phone layout check

# 用幾種手機 / 平板尺寸打開主選單、世界地圖、關卡面板、戰鬥、暫停，
# 檢查按鈕有沒有被別的東西蓋住、有沒有超出畫面、有沒有程式錯誤。截圖會上傳成 artifact。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build
        run: npx vite build

      - name: Start preview server
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:4173/td.html && exit 0; sleep 1; done
          cat preview.log; exit 1

      - name: Check phone layouts
        run: node scripts/phone-check.cjs phone-check

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-check
          path: phone-check/
          retention-days: 7
